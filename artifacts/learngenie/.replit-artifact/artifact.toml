kind = "web"
previewPath = "/"
title = "LearnGenie AI"
version = "1.0.0"
id = "artifacts/learngenie"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20891

[services.development]
run = "pnpm --filter @workspace/learngenie run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learngenie", "run", "build" ]
publicDir = "artifacts/learngenie/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20891"
BASE_PATH = "/"
